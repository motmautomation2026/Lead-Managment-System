services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8787}:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # DB-3: transaction pooler (6543); session pooler (5432), blank = DATABASE_URL (warned).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SESSION_URL: ${DATABASE_SESSION_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      # Shared Google OAuth app for the one-click "Connect Google Calendar"
      # button. Optional, but all three must be set together (Backend/src/env.ts
      # refuses to start otherwise). Only the API uses them, not the worker.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Optional public website-form lead intake. Set both together or leave
      # both blank (endpoint stays disabled). Only the API uses them.
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      INGEST_WORKSPACE_ID: ${INGEST_WORKSPACE_ID:-}
      # Knowledge-base embeddings. Optional; backend and worker only.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # REL-1: everything else the API reads (blank = the code's default; see docs/release/04-env-vars.md).
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-}
      OPENAI_GROUNDING_MODEL: ${OPENAI_GROUNDING_MODEL:-}
      OPENAI_PRICES_JSON: ${OPENAI_PRICES_JSON:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_SESSION_POOL_MAX: ${DB_SESSION_POOL_MAX:-}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-}
      SESSION_POOLER_MAX_CLIENTS: ${SESSION_POOLER_MAX_CLIENTS:-}
    restart: unless-stopped

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    init: true
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      # DB-3: the WhatsApp session locks need the session pooler (5432).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SESSION_URL: ${DATABASE_SESSION_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-false}
      EMAIL_IMAP_POLL_SECONDS: ${EMAIL_IMAP_POLL_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # REL-1: everything else the worker reads (blank = the code's default; see docs/release/04-env-vars.md).
      AGENT_RUNNER_ENABLED: ${AGENT_RUNNER_ENABLED:-false}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-}
      OPENAI_GROUNDING_MODEL: ${OPENAI_GROUNDING_MODEL:-}
      OPENAI_PRICES_JSON: ${OPENAI_PRICES_JSON:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CRM_COMPANY_SWEEP_ENABLED: ${CRM_COMPANY_SWEEP_ENABLED:-true}
      CRM_DEAL_SWEEP_ENABLED: ${CRM_DEAL_SWEEP_ENABLED:-true}
      WORKER_DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-}
      DB_SESSION_POOL_MAX: ${DB_SESSION_POOL_MAX:-}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-}
      SESSION_POOLER_MAX_CLIENTS: ${SESSION_POOLER_MAX_CLIENTS:-}
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      # Vite bakes these into the static bundle at build time — nginx serves
      # static files with no server-side runtime to read env vars from after
      # the image is built, so these must be build args, not `environment:`.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8787}
    init: true
    ports:
      # nginx.conf hardcodes `listen 8080` inside the container (the
      # nginx-unprivileged base image's default) — only the host side of this
      # mapping is configurable.
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - backend
